name: Build

# Called by the release templates AFTER a release is cut. Builds the `fzt`
# picker CLI (cmd/fzt) for three OSes, and the fzt library (cmd/fztlib) as a
# Windows DLL for apps that load fzt in-process, and uploads them to that
# release. The tag is passed as an input, so the build checks out exactly what
# was released. Every pull request runs the picker builds, signing included,
# without the upload, so a release is never their first run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build artifacts for (and upload to)'
        required: true
        type: string

jobs:
  # On Windows for signtool. upstairspc, host mode: its bash is WSL's
  # launcher, and the runner's account has an interactive pwsh profile (the
  # home shell), which a step must not load.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -ldflags "-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt-windows-amd64.exe ./cmd/fzt

      - name: Build DLL
        env:
          CGO_ENABLED: "1"
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'no gcc on the runner (WinLibs, upstairspc winget)' }
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -buildmode=c-shared -ldflags "-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt-windows-amd64.dll ./cmd/fztlib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Defender quarantined an unsigned tmux build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts.
      - name: Sign
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD fzt-windows-amd64.exe fzt-windows-amd64.dll
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\cert.pfx", $env:PFX_PASSWORD)
            foreach ($file in 'fzt-windows-amd64.exe', 'fzt-windows-amd64.dll') {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
                throw "Invalid signing certificate on $file ($($signature.Status))"
              }
              Write-Host "$file signed by $($signature.SignerCertificate.Thumbprint)"
            }
            $certificate.Dispose()
          } finally { Remove-Item cert.pfx }

      - name: Upload signed Windows assets
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $hash = (Get-FileHash fzt-windows-amd64.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\fzt-windows-amd64.dll.sha256", "$hash  fzt-windows-amd64.dll`n", [Text.Encoding]::ASCII)
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/releases"
          $headers = @{ Authorization = "token $env:TOKEN" }
          $release = Invoke-RestMethod "$api/tags/$env:TAG" -Headers $headers
          $files = 'fzt-windows-amd64.exe', 'fzt-windows-amd64.dll', 'fzt-windows-amd64.dll.sha256'
          foreach ($file in $files) {
            foreach ($old in @($release.assets | Where-Object name -eq $file)) {
              Invoke-RestMethod -Method Delete "$api/$($release.id)/assets/$($old.id)" -Headers $headers | Out-Null
            }
            Invoke-RestMethod -Method Post "$api/$($release.id)/assets?name=$file" -Headers $headers -Form @{ attachment = Get-Item $file } | Out-Null
            Write-Host "Uploaded $file"
          }
          $published = Invoke-RestMethod "$api/$($release.id)" -Headers $headers
          foreach ($file in $files) {
            if (-not ($published.assets | Where-Object { $_.name -eq $file -and $_.size -eq (Get-Item $file).Length })) {
              throw "Release $env:TAG is missing the expected $file"
            }
          }

  unix:
    # Pure-Go cross-compiles use the fast Windows pool. Only the shared
    # release template needs the NAS; builders upload their own assets.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    env:
      TAG: ${{ inputs.tag }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ldflags = "-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine"
          $env:GOOS = 'linux'; $env:GOARCH = 'amd64'
          go build -ldflags $ldflags -o fzt-linux-amd64 ./cmd/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOOS = 'darwin'; $env:GOARCH = 'arm64'
          go build -ldflags $ldflags -o fzt-darwin-arm64 ./cmd/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Unix assets
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/releases"
          $headers = @{ Authorization = "token $env:TOKEN" }
          $release = Invoke-RestMethod "$api/tags/$env:TAG" -Headers $headers
          $files = 'fzt-linux-amd64', 'fzt-darwin-arm64'
          foreach ($file in $files) {
            foreach ($old in @($release.assets | Where-Object name -eq $file)) {
              Invoke-RestMethod -Method Delete "$api/$($release.id)/assets/$($old.id)" -Headers $headers | Out-Null
            }
            Invoke-RestMethod -Method Post "$api/$($release.id)/assets?name=$file" -Headers $headers -Form @{ attachment = Get-Item $file } | Out-Null
            Write-Host "Uploaded $file"
          }
          $published = Invoke-RestMethod "$api/$($release.id)" -Headers $headers
          foreach ($file in $files) {
            if (-not ($published.assets | Where-Object { $_.name -eq $file -and $_.size -eq (Get-Item $file).Length })) {
              throw "Release $env:TAG is missing the expected $file"
            }
          }
