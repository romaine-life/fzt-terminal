name: Dependency Update

# Claude-driven CI, run by hand: dispatch it through the Forgejo API (see
# CLAUDE.md, CI). Downstream consumers are updated manually per repo.
on:
  workflow_dispatch:

concurrency:
  # Shared with release.yml so tag-cutting is serialized across dep-update
  # and direct-push release paths (prevents patch-number races).
  group: release-tag
  cancel-in-progress: false

jobs:
  update:
    uses: romaine-life/pipeline-templates/.forgejo/workflows/go-dependency-update-template.yml@main
    secrets: inherit
    with:
      modules: github.com/romaine-life/fzt github.com/romaine-life/fzt-frontend
      # Template handles bump + release atomically, then fires build.yml to
      # attach the `fzt` picker binaries to the new release.
      artifact-build-workflow: build.yml
