name: Release

# Started by strip-owner when a PR it landed needs a release (agent-tools,
# AHT-69); never by hand. A dependency change on main also releases after its
# PR merges. strip-owner then starts the bump in each repo whose dispatch.yml
# names this module.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [go.mod, go.sum]

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    # Filter events above: Forgejo evaluates a caller job's `if` inside the
    # expanded workflow_call, where event_name is no longer workflow_dispatch.
    uses: romaine-life/pipeline-templates/.forgejo/workflows/release-and-dispatch-template.yml@main
    secrets: inherit
    with:
      artifact-build-workflow: build.yml
      draft-release: true
