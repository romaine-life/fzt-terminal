name: Release

# Claude-driven CI, run by hand: dispatch it through the Forgejo API (see
# CLAUDE.md, CI). It also runs when dispatch.yml's dependency bump merges
# ("deps: update" pushed to main); any other push to main skips it.
# Downstream consumers are updated manually per repo.
#
# Cuts the next v0.1.N release at main's HEAD, runs build.yml with the new
# tag to attach the binaries, and syncs the GitHub push mirror so the tag is
# on GitHub at once (go get, go install). If HEAD already has a released
# v0.1.* tag it does nothing.
#
# Self-contained rather than pipeline-templates' release template: Forgejo
# only expands another repo's reusable workflow when its owner is a public
# user or org, and romaine-life is private.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # Shared with dispatch.yml so tag-cutting is serialized across the
  # dependency-update and direct release paths (prevents patch-number races).
  group: release-tag
  cancel-in-progress: false

env:
  PREFIX: v0.1

jobs:
  release:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'deps: update')"
    runs-on: ubuntu-latest
    env:
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      # ref=ref_name resolves the branch's HEAD at run time, not the sha
      # captured when the run was scheduled.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Versions come from git tags, not releases: a tag can exist without a
      # release (a module tag pushed by hand). A version tag at HEAD with no
      # release is released as-is rather than skipped or renumbered.
      - name: Skip if HEAD already released
        id: check
        env:
          FJ: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha=$(git rev-parse HEAD)
          existing=$(git tag --points-at HEAD -l "${PREFIX}.*" --sort=-v:refname | head -1)
          code=000
          if [ -n "$existing" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $FJ" "$API/releases/tags/$existing")
          fi
          if [ "$code" = 200 ]; then
            echo "HEAD ($head_sha) already released as $existing, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$existing" ]; then
              if [ "$code" != 404 ]; then echo "::error::release lookup for $existing returned HTTP $code"; exit 1; fi
              echo "HEAD ($head_sha) is tagged $existing with no release, releasing that tag"
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "existing=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        id: release
        if: steps.check.outputs.skip != 'true'
        env:
          FJ: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.check.outputs.existing }}
        run: |
          if [ -n "$EXISTING" ]; then
            next="$EXISTING"
          else
            latest=$(git tag -l "${PREFIX}.*" --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              next="${PREFIX}.0"
            else
              next="${PREFIX}.$(( ${latest#"${PREFIX}."} + 1 ))"
            fi
          fi
          sha=$(git rev-parse HEAD)
          echo "Cutting release $next at $sha"
          body=$(jq -n --arg tag "$next" --arg sha "$sha" --arg notes "$(git log --oneline -1)" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $notes}')
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: token $FJ" -H 'Content-Type: application/json' \
            -d "$body" "$API/releases")
          if [ "$code" != 201 ]; then
            echo "::error::creating release $next returned HTTP $code"
            cat response.json
            exit 1
          fi
          # An existing tag elsewhere would silently carry the release; prove
          # the tag is on HEAD.
          git fetch -q origin "refs/tags/$next:refs/tags/$next"
          tagged=$(git rev-list -n1 "$next")
          if [ "$tagged" != "$sha" ]; then
            echo "::error::release $next points at $tagged, not $sha"
            exit 1
          fi
          echo "new-tag=$next" >> "$GITHUB_OUTPUT"

      # build.yml checks out the tag, builds, and uploads the assets to this
      # release.
      - name: Run build.yml for the release
        if: steps.check.outputs.skip != 'true'
        env:
          DT: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          REF: ${{ github.ref_name }}
          TAG: ${{ steps.release.outputs.new-tag }}
        run: |
          body=$(jq -n --arg ref "$REF" --arg tag "$TAG" '{ref: $ref, inputs: {tag: $tag}}')
          curl -sS --fail-with-body -X POST \
            -H "Authorization: token $DT" -H 'Content-Type: application/json' \
            -d "$body" "$API/actions/workflows/build.yml/dispatches"
          echo "Ran build.yml with tag=$TAG"

      # The push mirror would carry the tag within its interval; sync now so
      # GitHub (go get, go install) has it at once.
      - name: Sync push mirror
        if: steps.check.outputs.skip != 'true'
        env:
          DT: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST -H "Authorization: token $DT" "$API/push_mirrors-sync"
