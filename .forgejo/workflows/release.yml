name: Release

# Claude-driven CI, run by hand: dispatch it through the Forgejo API (see
# CLAUDE.md, CI). A dependency change on main also releases after its PR
# merges. Downstream consumers are updated manually per repo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [go.mod, go.sum]

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    # Filter events above: Forgejo evaluates a caller job's `if` inside the
    # expanded workflow_call, where event_name is no longer workflow_dispatch.
    uses: romaine-life/pipeline-templates/.forgejo/workflows/release-and-dispatch-template.yml@main
    secrets: inherit
    with:
      artifact-build-workflow: build.yml
      draft-release: true
