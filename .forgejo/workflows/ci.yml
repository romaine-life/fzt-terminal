name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fetch check reads only the repo, and runs where Python is (FORGEJO-28).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          $files = gofmt -l .
          if ($LASTEXITCODE) { throw "gofmt exited $LASTEXITCODE" }
          if ($files) { gofmt -d $files; throw "not gofmt-formatted: $($files -join ', ')" }
      - run: go vet ./...
      - run: go test ./...

  dll:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # upstairspc, host mode. The runner's account has an interactive pwsh
    # profile (the home shell), which a step must not load.
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'no gcc on the runner (WinLibs, upstairspc winget)' }
          gcc --version | Select-Object -First 1
          go build -buildmode=c-shared -o fzt-windows-amd64.dll ./cmd/fztlib
      - uses: forgejo/upload-artifact@v4
        with:
          name: fzt-windows-amd64-dll
          path: |
            fzt-windows-amd64.dll
            fzt-windows-amd64.h

  # build.yml builds these for a release and uploads them; these run the same
  # builds, signing included, on every change so a release is never their first
  # run. On Windows for signtool. upstairspc, host mode: its bash is WSL's
  # launcher, and the runner's account has an interactive pwsh profile (the
  # home shell), which a step must not load.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -ldflags "-X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt-windows-amd64.exe ./cmd/fzt

      - name: Build DLL
        env:
          CGO_ENABLED: "1"
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'no gcc on the runner (WinLibs, upstairspc winget)' }
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -buildmode=c-shared -ldflags "-X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt-windows-amd64.dll ./cmd/fztlib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Defender quarantined an unsigned tmux build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts.
      - name: Sign
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD fzt-windows-amd64.exe fzt-windows-amd64.dll
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\cert.pfx", $env:PFX_PASSWORD)
            foreach ($file in 'fzt-windows-amd64.exe', 'fzt-windows-amd64.dll') {
              $signature = Get-AuthenticodeSignature $file
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
                throw "Invalid signing certificate on $file ($($signature.Status))"
              }
              Write-Host "$file signed by $($signature.SignerCertificate.Thumbprint)"
            }
            $certificate.Dispose()
          } finally { Remove-Item cert.pfx }

  unix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pure-Go cross-compiles use the fast Windows pool.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ldflags = "-X github.com/romaine-life/fzt-frontend.EngineVersion=$engine"
          $env:GOOS = 'linux'; $env:GOARCH = 'amd64'
          go build -ldflags $ldflags -o fzt-linux-amd64 ./cmd/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GOOS = 'darwin'; $env:GOARCH = 'arm64'
          go build -ldflags $ldflags -o fzt-darwin-arm64 ./cmd/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
